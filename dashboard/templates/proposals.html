{% extends "base.html" %}
{% block title %}Proposals{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Proposals</h1>
    <p class="page-subtitle">WP10 — Kimis formale Vorschläge</p>
  </div>
  <div id="stats" style="display:flex;gap:10px;flex-wrap:wrap"></div>
</div>

<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
  <button class="btn btn-primary tab-btn" data-status="open">Offen</button>
  <button class="btn btn-secondary tab-btn" data-status="accepted">Angenommen</button>
  <button class="btn btn-secondary tab-btn" data-status="withdrawn">Zurückgezogen</button>
  <button class="btn btn-secondary tab-btn" data-status="rejected">Abgelehnt</button>
  <button class="btn btn-secondary tab-btn" data-status="all" style="opacity:0.6">Alle</button>
</div>

<div id="proposals-list" style="display:flex;flex-direction:column;gap:10px"></div>

<script>
const TYPE_LABELS = {
  self_constitution_change: "soul.md / Kernprinzipien",
  behavior_adjustment:      "Verhalten / Stil",
  workflow_improvement:     "Workflow / Ablauf",
  architecture_improvement: "Architektur",
  memory_improvement:       "Gedächtnis",
  other:                    "Sonstiges",
};
const TYPE_COLORS = {
  self_constitution_change: "#7c3aed",
  behavior_adjustment:      "#2563eb",
  workflow_improvement:     "#059669",
  architecture_improvement: "#d97706",
  memory_improvement:       "#0891b2",
  other:                    "#6b7280",
};
const STATUS_LABELS = {
  open: "offen", accepted: "angenommen",
  rejected: "abgelehnt", withdrawn: "zurückgezogen",
};
const STATUS_BORDER = {
  open: "#f59e0b", accepted: "#10b981",
  rejected: "#ef4444", withdrawn: "#6b7280",
};

let currentStatus = "open";

async function load(status) {
  currentStatus = status;
  const url = status === "all"
    ? "/api/proposals?status=all"
    : `/api/proposals?status=${status}`;
  const res = await fetch(url);
  const data = await res.json();

  // Stats
  const s = data.stats || {};
  document.getElementById("stats").innerHTML = [
    ["Offen", s.open || 0, "#f59e0b"],
    ["Angenommen", s.accepted || 0, "#10b981"],
    ["Zurückgezogen", s.withdrawn || 0, "#6b7280"],
    ["Abgelehnt", s.rejected || 0, "#ef4444"],
  ].map(([l, v, c]) =>
    `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:12px">
      <span style="color:${c};font-weight:600">${v}</span>
      <span style="color:var(--text-3);margin-left:4px">${l}</span></div>`
  ).join("");

  const el = document.getElementById("proposals-list");
  if (!data.proposals || !data.proposals.length) {
    el.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:30px;text-align:center">Keine Proposals.</div>';
    return;
  }

  el.innerHTML = data.proposals.map(p => {
    const type = p.proposal_type || "other";
    const typeLabel = TYPE_LABELS[type] || type;
    const typeColor = TYPE_COLORS[type] || "#6b7280";
    const statusLabel = STATUS_LABELS[p.status] || p.status;
    const border = STATUS_BORDER[p.status] || "#6b7280";
    const ts = (p.created_at || "").substring(0, 16).replace("T", " ");
    const isOpen = p.status === "open";

    return `<div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${border};border-radius:var(--radius-lg);padding:16px 18px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:${typeColor}22;color:${typeColor}">${typeLabel}</span>
        <span style="font-size:11px;color:var(--text-3)">${statusLabel}</span>
        <span style="font-size:11px;color:var(--text-4)">#${p.id} · ${ts}</span>
        <span style="font-size:11px;color:var(--text-4)">${p.source || "chat"}</span>
      </div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${p.title}</div>
      ${p.summary ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:6px;line-height:1.5">${p.summary.substring(0, 300)}${p.summary.length > 300 ? "…" : ""}</div>` : ""}
      ${p.reason ? `<div style="font-size:12px;color:var(--text-3);font-style:italic;margin-bottom:6px">Begründung: ${p.reason.substring(0, 150)}${p.reason.length > 150 ? "…" : ""}</div>` : ""}
      ${p.suggested_change ? `<div style="font-size:12px;color:var(--text-2);margin-bottom:6px;background:var(--bg);padding:8px;border-radius:var(--radius);border:1px solid var(--border)">Vorgeschlagene Änderung: ${p.suggested_change.substring(0, 250)}${p.suggested_change.length > 250 ? "…" : ""}</div>` : ""}
      ${p.risk_note ? `<div style="font-size:11px;color:#d97706;margin-bottom:6px">⚠ ${p.risk_note.substring(0, 100)}</div>` : ""}
      ${p.decision_note ? `<div style="font-size:11px;color:var(--text-3);margin-bottom:6px">Entscheidung: ${p.decision_note.substring(0, 150)}</div>` : ""}
      <div style="font-size:11px;color:#6b7280;margin-top:4px;padding:4px 8px;background:#1c1917;border-radius:4px;display:inline-block">
        WP10 — Kein automatischer Todo/Task/ORBIT aus diesem Proposal
      </div>
      ${isOpen ? `<div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-primary" style="font-size:12px;padding:5px 12px" onclick="action(${p.id}, 'accept')">✓ Annehmen</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 12px" onclick="action(${p.id}, 'withdraw')">↩ Zurückziehen</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 12px;color:#ef4444;border-color:#ef4444" onclick="action(${p.id}, 'reject')">✗ Ablehnen</button>
      </div>` : ""}
    </div>`;
  }).join("");
}

async function action(id, act) {
  await fetch(`/api/proposals/${id}/action`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: act}),
  });
  load(currentStatus);
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => {
      b.className = "btn btn-secondary tab-btn";
    });
    btn.className = "btn btn-primary tab-btn";
    load(btn.dataset.status);
  });
});

load("open");
</script>
{% endblock %}
