{% extends "base.html" %}
{% block title %}Workspace{% endblock %}

{% block content %}
<div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
    <div>
        <h1>Workspace</h1>
        <p>Kimis Skripte — selbst entwickelt, selbst ausgeführt</p>
    </div>
    <button class="btn btn-primary" onclick="openNew()">+ Neu</button>
</div>

<!-- Stats -->
<div id="ws-stats" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap"></div>

<!-- Dateiliste -->
<div id="file-list">
    <div class="loading">Lade Workspace...</div>
</div>

<!-- Editor Modal -->
<div id="modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:800px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg)">
        <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:15px;font-weight:600;color:var(--text-1)" id="modal-title">Neue Datei</div>
            <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3)">✕</button>
        </div>
        <input id="editor-filename" placeholder="dateiname.py" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px;font-family:var(--font-mono)">
        <textarea id="editor-code" style="flex:1;min-height:320px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px;font-family:var(--font-mono);resize:vertical;line-height:1.5" placeholder="# Python-Code hier..."></textarea>
        <div style="display:flex;gap:8px;justify-content:space-between;align-items:center">
            <div id="run-output" style="font-size:12px;color:var(--text-3);font-family:var(--font-mono);max-width:500px;white-space:pre-wrap;max-height:80px;overflow:auto"></div>
            <div style="display:flex;gap:8px">
                <button class="btn btn-secondary" onclick="runCode()" id="run-btn">▶ Ausführen</button>
                <button class="btn btn-primary" onclick="saveFile()" id="save-btn">Speichern</button>
            </div>
        </div>
    </div>
</div>

<style>
.file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    transition: border-color .15s;
}
.file-card:hover { border-color: var(--border-2); }
.file-icon {
    width: 36px; height: 36px;
    background: var(--bg);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
}
.file-name { font-size: 14px; font-weight: 500; color: var(--text-1); font-family: var(--font-mono); }
.file-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.file-preview { font-size: 11px; color: var(--text-4); font-family: var(--font-mono); margin-top: 6px; white-space: pre-wrap; line-height: 1.4; max-height: 48px; overflow: hidden; }
.file-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 18px;
    min-width: 120px;
}
.stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.stat-value { font-size: 22px; font-weight: 600; color: var(--text-1); margin-top: 2px; }
.idea-badge {
    font-size: 10px; font-weight: 500;
    padding: 2px 6px;
    border-radius: 99px;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    margin-left: 6px;
}
</style>

<script>
let allFiles = [];

async function loadFiles() {
    const res = await fetch('/api/workspace/files');
    allFiles = await res.json();
    renderStats();
    renderFiles();
}

function renderStats() {
    const ideas = allFiles.filter(f => f.name.startsWith('idea_')).length;
    const tools = allFiles.filter(f => !f.name.startsWith('idea_')).length;
    const totalLines = allFiles.reduce((s, f) => s + f.lines, 0);
    document.getElementById('ws-stats').innerHTML = `
        <div class="stat-card"><div class="stat-label">Skripte gesamt</div><div class="stat-value">${allFiles.length}</div></div>
        <div class="stat-card"><div class="stat-label">Ideen-Stubs</div><div class="stat-value">${ideas}</div></div>
        <div class="stat-card"><div class="stat-label">Werkzeuge</div><div class="stat-value">${tools}</div></div>
        <div class="stat-card"><div class="stat-label">Zeilen gesamt</div><div class="stat-value">${totalLines}</div></div>
    `;
}

function renderFiles() {
    const container = document.getElementById('file-list');
    if (!allFiles.length) {
        container.innerHTML = '<div class="loading">Noch keine Skripte — Kimi entwickelt sie aus eigenen Ideen oder du kannst neue anlegen.</div>';
        return;
    }

    // Sortierung: Werkzeuge zuerst, Ideen-Stubs danach; innerhalb: nach Änderungsdatum
    const sorted = [...allFiles].sort((a, b) => {
        const aIdea = a.name.startsWith('idea_');
        const bIdea = b.name.startsWith('idea_');
        if (aIdea !== bIdea) return aIdea ? 1 : -1;
        return b.modified - a.modified;
    });

    container.innerHTML = sorted.map(f => {
        const isIdea = f.name.startsWith('idea_');
        const date = new Date(f.modified * 1000).toLocaleString('de-DE', {
            day: '2-digit', month: '2-digit', year: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });
        const preview = f.preview.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `
        <div class="file-card" onclick="openEdit('${esc(f.name)}')">
            <div class="file-icon">${isIdea ? '💡' : '🔧'}</div>
            <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center">
                    <span class="file-name">${esc(f.name)}</span>
                    ${isIdea ? '<span class="idea-badge">Idee</span>' : ''}
                </div>
                <div class="file-meta">${f.lines} Zeilen · ${f.size} Bytes · ${date}</div>
                <div class="file-preview">${preview}</div>
            </div>
            <div class="file-actions" onclick="event.stopPropagation()">
                <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px" onclick="runFile('${esc(f.name)}')">▶</button>
                <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px" onclick="openEdit('${esc(f.name)}')">✏</button>
                <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;color:var(--red)" onclick="deleteFile('${esc(f.name)}')">🗑</button>
            </div>
        </div>`;
    }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function openNew() {
    document.getElementById('modal-title').textContent = 'Neue Datei';
    document.getElementById('editor-filename').value = '';
    document.getElementById('editor-code').value = '# Kimis neues Skript\n\n';
    document.getElementById('run-output').textContent = '';
    showModal();
}

function openEdit(filename) {
    const f = allFiles.find(x => x.name === filename);
    if (!f) return;
    document.getElementById('modal-title').textContent = filename;
    document.getElementById('editor-filename').value = filename;
    document.getElementById('editor-code').value = f.content;
    document.getElementById('run-output').textContent = '';
    showModal();
}

async function runFile(filename) {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '...';
    try {
        const res = await fetch('/api/workspace/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename})
        });
        const data = await res.json();
        alert(`Output:\n${data.output || data.error || '(leer)'}`);
    } finally {
        btn.disabled = false; btn.textContent = '▶';
    }
}

async function runCode() {
    const code = document.getElementById('editor-code').value;
    const out = document.getElementById('run-output');
    const btn = document.getElementById('run-btn');
    btn.disabled = true; btn.textContent = '...';
    out.textContent = 'Läuft...';
    try {
        const res = await fetch('/api/workspace/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code})
        });
        const data = await res.json();
        out.textContent = data.output || data.error || '(kein Output)';
    } finally {
        btn.disabled = false; btn.textContent = '▶ Ausführen';
    }
}

async function saveFile() {
    const filename = document.getElementById('editor-filename').value.trim();
    const code     = document.getElementById('editor-code').value;
    const btn      = document.getElementById('save-btn');
    if (!filename) { alert('Dateiname fehlt'); return; }
    btn.disabled = true; btn.textContent = '...';
    try {
        const res = await fetch('/api/workspace/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename, code})
        });
        const data = await res.json();
        if (data.result && !data.result.startsWith('Fehler')) {
            closeModal();
            await loadFiles();
        } else {
            alert(data.result || data.error);
        }
    } finally {
        btn.disabled = false; btn.textContent = 'Speichern';
    }
}

async function deleteFile(filename) {
    if (!confirm(`'${filename}' löschen?`)) return;
    await fetch('/api/workspace/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({filename})
    });
    await loadFiles();
}

function showModal() {
    const bd = document.getElementById('modal-backdrop');
    bd.style.display = 'flex';
}
function closeModal() {
    document.getElementById('modal-backdrop').style.display = 'none';
}
document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
});

loadFiles();
</script>
{% endblock %}
