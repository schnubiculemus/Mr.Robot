{% extends "base.html" %}
{% block title %}Workspace{% endblock %}

{% block content %}
<div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
  <div>
    <h1>Workspace</h1>
    <p style="color:var(--text-3);font-size:13px">Kimis Artefakt-Werkbank — linienbasiert, versioniert, auditiert</p>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-primary" onclick="showTab('artifacts')" id="tab-artifacts">Artefakte</button>
    <button class="btn btn-secondary" onclick="showTab('lines')" id="tab-lines">Linien</button>
    <button class="btn btn-secondary" onclick="showTab('legacy')" id="tab-legacy">Legacy</button>
  </div>
</div>

<div id="ws-stats" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap"></div>

<div id="tab-content-artifacts">
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <select id="filter-type" onchange="loadArtifacts()" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px">
      <option value="">Alle Typen</option>
      <option value="brief">Brief</option><option value="analysis">Analysis</option>
      <option value="plan">Plan</option><option value="implementation">Implementation</option>
      <option value="result">Result</option><option value="report">Report</option>
    </select>
    <select id="filter-status" onchange="loadArtifacts()" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px">
      <option value="">Alle Status</option>
      <option value="active">Active</option><option value="draft">Draft</option><option value="final">Final</option>
    </select>
  </div>
  <div id="artifact-list"><div class="loading">Lade Artefakte...</div></div>
</div>

<div id="tab-content-lines" style="display:none">
  <div id="lines-list"><div class="loading">Lade Linien...</div></div>
</div>

<div id="tab-content-legacy" style="display:none">
  <div style="padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;font-size:13px;color:var(--text-3)">
    Legacy-Dateien (flacher Workspace). Neue Writes laufen ueber Artefakte.
  </div>
  <div id="legacy-list"></div>
</div>

<div id="modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:800px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:15px;font-weight:600" id="modal-title"></div>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3)">x</button>
    </div>
    <div id="modal-meta" style="font-size:12px;color:var(--text-3)"></div>
    <textarea id="modal-content" style="flex:1;min-height:300px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px;font-family:var(--font-mono);resize:vertical;line-height:1.5" readonly></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <select id="modal-status" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:13px">
        <option value="draft">Draft</option><option value="active">Active</option>
        <option value="final">Final</option><option value="archived">Archived</option>
      </select>
      <button class="btn btn-primary" onclick="saveStatus()">Status setzen</button>
    </div>
  </div>
</div>

<script>
const TYPE_COLORS = {
  brief:'#dbeafe|#1e40af',analysis:'#ede9fe|#5b21b6',plan:'#fef3c7|#92400e',
  implementation:'#d1fae5|#065f46',result:'#dcfce7|#166534',report:'#f3f4f6|#374151',
  worklog:'#fce7f3|#9d174d',patch:'#ffedd5|#c2410c',test:'#e0f2fe|#0369a1',review:'#fef9c3|#854d0e'
};
const STATUS_COLORS = {
  draft:'#f3f4f6|#6b7280',active:'#d1fae5|#065f46',final:'#dbeafe|#1e40af',
  superseded:'#fef3c7|#92400e',archived:'#f9fafb|#9ca3af'
};
let currentArtifactId = null;

function typeBadge(t) {
  const [bg,c]=(TYPE_COLORS[t]||'#f3f4f6|#6b7280').split('|');
  return '<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;text-transform:uppercase;background:'+bg+';color:'+c+'">'+t+'</span>';
}
function statusBadge(s) {
  const [bg,c]=(STATUS_COLORS[s]||'#f3f4f6|#6b7280').split('|');
  return '<span style="font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;background:'+bg+';color:'+c+'">'+s+'</span>';
}

async function loadStats() {
  const res = await fetch('/api/workspace/stats');
  const d = await res.json();
  const byType = Object.fromEntries((d.by_type||[]).map(x=>[x.artifact_type,x.n]));
  const cards = [
    ['Gesamt', d.total||0, ''],
    ['Vollzug', d.materialized||0, 'color:#10b981'],
  ].concat(Object.entries(byType).slice(0,3).map(([t,n])=>[t,n,'']));
  document.getElementById('ws-stats').innerHTML = cards.map(([l,v,s])=>
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 18px;min-width:100px"><div style="font-size:11px;color:var(--text-3);text-transform:uppercase">'+l+'</div><div style="font-size:22px;font-weight:600;'+s+'">'+v+'</div></div>'
  ).join('');
}

async function loadArtifacts() {
  const type = document.getElementById('filter-type').value;
  const status = document.getElementById('filter-status').value;
  let url = '/api/workspace/artifacts/recent?limit=30';
  if (type) url += '&type='+type;
  if (status) url += '&status='+status;
  const res = await fetch(url);
  const arts = await res.json();
  const el = document.getElementById('artifact-list');
  if (!arts.length) { el.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:16px">Keine Artefakte.</div>'; return; }
  el.innerHTML = arts.map(a => {
    const ts = new Date(a.created_at).toLocaleString('de',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;cursor:pointer" onclick="openArtifact('+a.id+')">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">'+typeBadge(a.artifact_type)+statusBadge(a.status)+
      (a.is_materialized_execution ? '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#d1fae5;color:#065f46;font-weight:500">Vollzug</span>' : '')+
      '<span style="font-size:12px;color:var(--text-3)">#'+a.id+' v'+a.version+'</span></div>'+
      '<div style="font-size:13px;font-weight:500">'+a.filename+'</div>'+
      '<div style="font-size:12px;color:var(--text-3);margin-top:2px">'+a.line_id+' &middot; '+(a.purpose||'')+' &middot; '+ts+'</div></div>';
  }).join('');
}

async function loadLines() {
  const res = await fetch('/api/workspace/lines');
  const lines = await res.json();
  const el = document.getElementById('lines-list');
  if (!lines.length) { el.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:16px">Keine Linien.</div>'; return; }
  el.innerHTML = lines.map(l => {
    const ts = l.last_workspace_write_at ? new Date(l.last_workspace_write_at).toLocaleString('de',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:500">'+l.line_id+'</span>'+
      '<span style="font-size:12px;color:var(--text-3)">'+l.artifact_count+' Artefakte &middot; '+ts+'</span></div>'+
      (l.latest_materialized_artifact_id ? '<div style="font-size:11px;color:#10b981;margin-top:3px">Vollzug materialisiert</div>' : '')+
      '</div>';
  }).join('');
}

async function loadLegacy() {
  try {
    const res = await fetch('/api/workspace/files');
    const files = await res.json();
    const el = document.getElementById('legacy-list');
    el.innerHTML = files.map(f =>
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px">'+
      '<span style="font-family:var(--font-mono);font-size:13px;flex:1">'+f.name+'</span>'+
      '<span style="font-size:12px;color:var(--text-3)">'+f.lines+' Zeilen</span></div>'
    ).join('') || '<div style="color:var(--text-3);font-size:13px">Keine Legacy-Dateien.</div>';
  } catch(e) { document.getElementById('legacy-list').innerHTML = '<div style="color:var(--text-3);font-size:13px">Legacy nicht verfuegbar.</div>'; }
}

async function openArtifact(id) {
  currentArtifactId = id;
  const res = await fetch('/api/workspace/artifacts/'+id);
  const d = await res.json();
  const a = d.artifact;
  document.getElementById('modal-title').textContent = a.filename;
  document.getElementById('modal-meta').innerHTML = typeBadge(a.artifact_type)+' '+statusBadge(a.status)+'&nbsp; Linie: '+a.line_id+'&nbsp; v'+a.version+'&nbsp; '+(a.created_at||'').substring(0,16);
  document.getElementById('modal-content').value = d.content || '(leer)';
  document.getElementById('modal-status').value = a.status;
  document.getElementById('modal-backdrop').style.display = 'flex';
}

async function saveStatus() {
  const status = document.getElementById('modal-status').value;
  await fetch('/api/workspace/artifacts/'+currentArtifactId+'/status', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status})
  });
  closeModal(); loadArtifacts(); loadStats();
}

function closeModal() { document.getElementById('modal-backdrop').style.display='none'; }
document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function showTab(tab) {
  ['artifacts','lines','legacy'].forEach(t=>{
    document.getElementById('tab-content-'+t).style.display=t===tab?'':'none';
    document.getElementById('tab-'+t).className='btn '+(t===tab?'btn-primary':'btn-secondary');
  });
  if(tab==='lines') loadLines();
  if(tab==='legacy') loadLegacy();
}

loadStats(); loadArtifacts();
</script>
{% endblock %}
